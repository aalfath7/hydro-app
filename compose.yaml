# Mencoba aplikasi di komputer sendiri: docker compose up --build
# Lalu buka http://localhost:8080. Produksi memakai compose.prod.yaml.
services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx.lokal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      NAMA_PERUSAHAAN: Hydro Demo
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py isi_demo
      && exec gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.1
    environment:
      POSTGRES_DB: hydro
      POSTGRES_USER: hydro
      POSTGRES_PASSWORD: hydro
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydro -d hydro"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
  media:
