name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18.1
        env:
          POSTGRES_DB: hydro
          POSTGRES_USER: hydro
          POSTGRES_PASSWORD: hydro
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U hydro" --health-interval 5s --health-retries 20
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: pytest --create-db
      - run: pip-audit -r requirements.txt
      - name: Skema API harus sama dengan yang tersimpan
        run: |
          python manage.py spectacular --file /tmp/schema.yaml --fail-on-warn
          diff /tmp/schema.yaml schema.yaml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipe API harus sama dengan skema
        run: |
          npm run tipe-api
          git diff --exit-code src/lib/api-types.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          versi=${GITHUB_REF_NAME#v}
          docker build -t "$REGISTRY/hydro-api:$versi" backend
          docker build -t "$REGISTRY/hydro-web:$versi" -f deploy/web.Dockerfile .
          echo "VERSI=$versi" >> "$GITHUB_ENV"
      - name: Pindai dengan Trivy
        run: |
          for nama in hydro-api hydro-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 \
              image --exit-code 1 --severity CRITICAL --ignore-unfixed "$REGISTRY/$nama:$VERSI"
          done
      - name: Kirim ke GHCR
        run: |
          docker push "$REGISTRY/hydro-api:$VERSI"
          docker push "$REGISTRY/hydro-web:$VERSI"
