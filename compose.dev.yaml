# Hanya untuk development: database lokal. Produksi memakai compose.yaml.
services:
  db:
    image: postgres:18.1
    environment:
      POSTGRES_DB: hydro
      POSTGRES_USER: hydro
      POSTGRES_PASSWORD: hydro
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydro -d hydro"]
      interval: 3s
      retries: 20

volumes:
  pgdata_dev:
