components:
  schemas:
    AlasanRequest:
      type: object
      properties:
        alasan:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - alasan
    Alokasi:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nomor_batch:
          type: string
          readOnly: true
        kedaluwarsa:
          type: string
          format: date
          readOnly: true
        jumlah_botol:
          type: integer
          maximum: 2147483647
          minimum: 0
        jumlah_diretur:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - jumlah_botol
      - kedaluwarsa
      - nomor_batch
    AturPasswordRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    BarangMasuk:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nomor:
          type: string
          maxLength: 30
        produk:
          type: integer
        produk_nama:
          type: string
          readOnly: true
        satuan_nama:
          type: string
          readOnly: true
        jumlah:
          type: integer
          maximum: 2147483647
          minimum: 0
        jumlah_botol:
          type: integer
          maximum: 2147483647
          minimum: 0
        tanggal:
          type: string
          format: date
        sumber:
          type: string
          maxLength: 160
        catatan:
          type: string
        nomor_batch:
          type: string
          readOnly: true
        kedaluwarsa:
          type: string
          format: date
          readOnly: true
        dibuat_oleh_nama:
          type: string
          readOnly: true
        dibuat_pada:
          type: string
          format: date-time
          readOnly: true
      required:
      - dibuat_oleh_nama
      - dibuat_pada
      - id
      - jumlah
      - jumlah_botol
      - kedaluwarsa
      - nomor
      - nomor_batch
      - produk
      - produk_nama
      - satuan_nama
      - tanggal
    BarangMasukBuatRequest:
      type: object
      properties:
        produk:
          type: integer
        satuan:
          type: integer
        jumlah:
          type: integer
          maximum: 10000000
          minimum: 1
        nomor_batch:
          type: string
          minLength: 1
          maxLength: 60
        kedaluwarsa:
          type: string
          format: date
        tanggal:
          type: string
          format: date
        sumber:
          type: string
          maxLength: 160
        catatan:
          type: string
      required:
      - jumlah
      - kedaluwarsa
      - nomor_batch
      - produk
      - satuan
    BarisPenjualan:
      type: object
      properties:
        periode:
          type: string
          format: date
        jumlah_transaksi:
          type: integer
        bruto:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        retur:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        neto:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - bruto
      - jumlah_transaksi
      - neto
      - periode
      - retur
    BarisPiutang:
      type: object
      properties:
        transaksi:
          type: integer
        nomor:
          type: string
        pelanggan:
          type: string
        tanggal:
          type: string
          format: date
        jatuh_tempo:
          type: string
          format: date
          nullable: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        retur:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        terbayar:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        sisa:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
